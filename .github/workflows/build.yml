name: Build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Re-check an existing release (e.g. v1.2.1.0): keep its zip, fix manifest.json if it doesn't match"
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Jellyfin.Plugin.IptvHub.sln
      - run: dotnet build Jellyfin.Plugin.IptvHub.sln -c Release --no-restore
      - run: dotnet test Jellyfin.Plugin.IptvHub.sln -c Release --no-build
      - name: Package plugin zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          else { $version = ([xml](Get-Content Jellyfin.Plugin.IptvHub/Jellyfin.Plugin.IptvHub.csproj)).Project.PropertyGroup.AssemblyVersion | Where-Object { $_ } | Select-Object -First 1 }
          # Same rule as the release job uses for manifest.json: an existing manifest entry wins,
          # otherwise the first line of the release notes.
          $changelog = ''
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $entry = $manifest[0].versions | Where-Object { $_.version -eq $version } | Select-Object -First 1
          if ($entry) { $changelog = $entry.changelog }
          elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $body = gh release view $env:GITHUB_REF_NAME --json body -q .body 2>$null
            if ($LASTEXITCODE -eq 0 -and $body) {
              $first = ($body -split "`n" | ForEach-Object { ($_ -replace '[*`]', '').Trim() } | Where-Object { $_ } | Select-Object -First 1)
              if ($first) { $changelog = $first.Substring(0, [Math]::Min(300, $first.Length)) }
            }
            $global:LASTEXITCODE = 0
          }
          "Changelog: $changelog" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          ./build.ps1 -Version $version -Changelog $changelog
          $zip = "dist/IptvHub_$version.zip"
          $md5 = (Get-FileHash $zip -Algorithm MD5).Hash.ToLowerInvariant()
          "Plugin zip: $zip  MD5: $md5" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "$md5  IptvHub_$version.zip" | Set-Content dist/MD5SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: IptvHub-plugin
          path: |
            dist/IptvHub_*.zip
            dist/MD5SUMS.txt
          if-no-files-found: error

  # Jellyfin checks the downloaded zip against manifest.json's MD5, so the zip on the release and the
  # manifest must always agree. This job never replaces a zip that is already attached (e.g. one
  # uploaded by hand), and always writes the manifest entry from the zip that is actually published.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-manifest
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/download-artifact@v4
        with:
          name: IptvHub-plugin
          path: dist
      - name: Publish release asset (never replace an existing zip)
        run: |
          set -euo pipefail
          version="${TAG#v}"
          asset="IptvHub_${version}.zip"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "IPTV Hub $version" --generate-notes --verify-tag
          fi

          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF "$asset"; then
            echo "Keeping the $asset already attached to $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if [ ! -f "dist/$asset" ]; then
              echo "::error::$TAG has no $asset and this build did not produce one (version mismatch?)"
              exit 1
            fi
            gh release upload "$TAG" "dist/$asset"
            echo "Uploaded CI-built $asset to $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # Everything below uses the zip as published, not the one built here.
          mkdir -p published
          gh release download "$TAG" --pattern "$asset" --dir published --clobber
          md5="$(md5sum "published/$asset" | cut -d' ' -f1)"
          echo "$md5  $asset" > published/MD5SUMS.txt
          gh release upload "$TAG" published/MD5SUMS.txt --clobber
          echo "Published $asset MD5: $md5" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Update manifest.json from the published zip
        run: |
          set -euo pipefail
          published_at="$(gh release view "$TAG" --json publishedAt -q .publishedAt)"
          notes="$(gh release view "$TAG" --json body -q .body | sed -e 's/[*`]//g' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' | head -n 1 | cut -c1-300)"
          changelog_args=()
          if ! python3 -c "import json,sys; v=json.load(open('manifest.json'))[0]['versions']; sys.exit(0 if any(x['version']=='$VERSION' for x in v) else 1)"; then
            changelog_args=(--changelog "${notes:-See the release notes for $TAG.}")
          fi
          result="$(python3 scripts/update_manifest.py \
            --version "$VERSION" \
            --zip "published/$ASSET" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" \
            --timestamp "$published_at" \
            "${changelog_args[@]}")"
          echo "manifest.json: $result" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$result" = "changed" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "Update manifest for $TAG"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
