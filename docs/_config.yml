title: IPTV Hub
description: A Jellyfin plugin for IPTV — M3U playlists, XMLTV guides and categories.
url: https://optimusprimeums.github.io
baseurl: /jellyfin-plugin-iptvhub

remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

color_scheme: dark
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "GitHub":
    - "https://github.com/Optimusprimeums/jellyfin-plugin-iptvhub"
  "Releases":
    - "https://github.com/Optimusprimeums/jellyfin-plugin-iptvhub/releases"
aux_links_new_tab: true

footer_content: "IPTV Hub is an unofficial plugin and is not affiliated with the Jellyfin project. Licensed under GPL-3.0 like Jellyfin."

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/Optimusprimeums/jellyfin-plugin-iptvhub"
gh_edit_branch: "master"
gh_edit_source: docs
gh_edit_view_mode: "tree"

exclude:
  - README.md
